{% extends "base.html" %}
{% block title %}Change password - {{ org_name }}{% endblock %}
{% block content %}
<div class="page-header">
  <div><div class="page-title">Change password</div><div class="page-sub">Requires your current password.</div></div>
</div>
<div class="card" style="max-width:420px;">
  <form method="POST">
    <div class="field"><label for="current_password">Current password</label><input type="password" id="current_password" name="current_password" required autofocus></div>
    <div class="field"><label for="new_password">New password</label><input type="password" id="new_password" name="new_password" minlength="6" required></div>
    <div class="field"><label for="confirm">Confirm new password</label><input type="password" id="confirm" name="confirm" minlength="6" required></div>
    <button type="submit" class="btn btn-primary">Change password</button>
  </form>
</div>
{% endblock %}
