<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password - {{ org_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title">Enter your reset code</div>
    <div class="auth-sub">Whoever has the code your admin relayed to you.</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
      <div class="field"><label for="username">Username</label><input type="text" id="username" name="username" required autofocus></div>
      <div class="field"><label for="code">Reset code</label><input type="text" id="code" name="code" required placeholder="From the webhook message or SMS"></div>
      <div class="field"><label for="new_password">New password</label><input type="password" id="new_password" name="new_password" minlength="6" required></div>
      <div class="field"><label for="confirm">Confirm new password</label><input type="password" id="confirm" name="confirm" minlength="6" required></div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Reset password</button>
    </form>
    <div class="auth-footer">Need a new code? <a href="{{ url_for('forgot_password') }}">Request one</a></div>
    <div class="auth-footer"><a href="{{ url_for('login') }}">Back to sign in</a></div>
  </div>
</div>
</body>
</html>
